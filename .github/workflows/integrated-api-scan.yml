name: Validate remaining 54-pair coverage
on:
  push:
    branches: [fix/roundtrip-provider-persistence]
    paths: [.github/workflows/integrated-api-scan.yml]
permissions:
  contents: write
concurrency:
  group: personal-flight-watch
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Offline regression checks
        run: python -m unittest discover -s tests -v
      - name: Restore history, attempt remaining pairs within Free caps and persist
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          FLIGHT_DISABLE_ALERTS: '1'
          API_INITIAL_BATCH: '18'
        run: |
          evidence="$RUNNER_TEMP/integration-evidence"
          mkdir -p "$evidence"
          failed=0
          for round in 1; do
            round_root="$RUNNER_TEMP/scan-$round"
            mkdir -p "$round_root"
            export FLIGHT_DB="$round_root/fares.sqlite3"
            RUNNER_TEMP="$round_root" python scripts/persist_state.py restore
            python scripts/audit_api_scan.py "$evidence/scan-$round.json" || failed=1
            RUNNER_TEMP="$round_root" python scripts/persist_state.py save
            sleep 10
          done
          exit "$failed"
      - name: Preserve safe integration evidence
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/integration-evidence" ]; then
            python scripts/publish_evidence.py "$RUNNER_TEMP/integration-evidence"
          fi
