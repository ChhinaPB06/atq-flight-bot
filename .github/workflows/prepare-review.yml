name: Inspect CI evidence and prepare review
on:
  push:
    branches: [fix/roundtrip-provider-persistence]
    paths: [.github/workflows/prepare-review.yml, scripts/inspect_ci.py]
permissions:
  contents: write
  actions: read
  pull-requests: write
concurrency:
  group: provider-experiment
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Inspect authorized logs, existing credentials and PR capability
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ChhinaPB06/atq-flight-bot
          AMADEUS_CLIENT_ID: ${{ secrets.AMADEUS_CLIENT_ID }}
          AMADEUS_CLIENT_SECRET: ${{ secrets.AMADEUS_CLIENT_SECRET }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: python scripts/inspect_ci.py "$RUNNER_TEMP/ci-evidence/ci-inspection.json"
      - name: Publish safe metadata
        run: python scripts/publish_evidence.py "$RUNNER_TEMP/ci-evidence"
