name: Bounded live provider comparison
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: provider-experiment
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FLI_TIMEOUT: '15'
      # Recover completed experiment evidence without repeating provider traffic.
      RECOVER_RUN_ID: ''
      EXPERIMENT_CHANNELS: browser
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Recover completed comparison artifact
        if: env.RECOVER_RUN_ID != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.RECOVER_RUN_ID }}
          pattern: provider-experiment-*
          merge-multiple: true
          path: ${{ runner.temp }}/provider-evidence
      - name: Prepare isolated provider versions
        if: env.RECOVER_RUN_ID == ''
        run: |
          mkdir -p "$RUNNER_TEMP/provider-evidence"
          phase=venv
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then printf "{\"outcome\":\"setup_failed\",\"phase\":\"%s\",\"exit_code\":%s}\n" "$phase" "$rc" > "$RUNNER_TEMP/provider-evidence/setup.json"; fi' EXIT
          python -m venv "$RUNNER_TEMP/stable"
          "$RUNNER_TEMP/stable/bin/pip" install -r requirements.txt
          python -m venv "$RUNNER_TEMP/upstream"
          "$RUNNER_TEMP/upstream/bin/pip" install 'git+https://github.com/punitarani/fli.git@881aee5ff4321e81ea2157cb44be94ce6a21dc1b'
          phase=playwright_package
          "$RUNNER_TEMP/upstream/bin/pip" install 'playwright==1.58.0'
          phase=browser_system_dependencies
          "$RUNNER_TEMP/upstream/bin/python" -m playwright install --with-deps chromium
      - name: Compare one exact round trip
        if: env.RECOVER_RUN_ID == ''
        id: compare
        run: |
          mkdir -p "$RUNNER_TEMP/provider-evidence"
          failed=0
          for channel in $EXPERIMENT_CHANNELS; do
            version="$channel"
            if [ "$channel" = browser ]; then version=upstream; fi
            "$RUNNER_TEMP/$version/bin/python" -m pip check
            "$RUNNER_TEMP/$version/bin/python" -m unittest discover -s tests -v
            timeout 120 "$RUNNER_TEMP/$version/bin/python" scripts/provider_experiment.py --channel "$channel" --output "$RUNNER_TEMP/provider-evidence/$channel.json" || failed=1
            sleep 10
          done
          exit "$failed"
      - name: Publish sanitized experiment evidence
        if: always()
        env:
          EXPERIMENT_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          evidence="$RUNNER_TEMP/provider-evidence"
          if [ ! -d "$evidence" ] || [ -z "$(ls -A "$evidence")" ]; then
            exit 0
          fi
          target="$RUNNER_TEMP/evidence-git"
          mkdir "$target"
          git init "$target"
          git -C "$target" remote add origin "$(git remote get-url origin)"
          git -C "$target" config include.path "$GITHUB_WORKSPACE/.git/config"
          existing=$(git -C "$target" ls-remote --heads origin refs/heads/flight-provider-evidence)
          if [ -n "$existing" ]; then
            git -C "$target" fetch --depth=1 origin flight-provider-evidence
            git -C "$target" checkout -b flight-provider-evidence FETCH_HEAD
          else
            git -C "$target" checkout --orphan flight-provider-evidence
          fi
          mkdir -p "$target/runs/$EXPERIMENT_RUN"
          cp "$evidence/"*.json "$target/runs/$EXPERIMENT_RUN/"
          printf '%s\n' "$GITHUB_SHA" > "$target/runs/$EXPERIMENT_RUN/publisher-commit.txt"
          printf '%s\n' "${RECOVER_RUN_ID:-$GITHUB_RUN_ID}" > "$target/runs/$EXPERIMENT_RUN/source-run.txt"
          git -C "$target" config user.name 'github-actions[bot]'
          git -C "$target" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$target" add runs
          git -C "$target" commit -m "Record bounded provider experiment $EXPERIMENT_RUN"
          git -C "$target" push origin HEAD:refs/heads/flight-provider-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-experiment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/provider-evidence/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Require live usable evidence
        if: always()
        run: |
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          files = list((Path(os.environ['RUNNER_TEMP'])/'provider-evidence').glob('*.json'))
          reports = [json.loads(p.read_text()) for p in files]
          if not any(r.get('outcome') == 'usable_live_quote' for r in reports):
              raise SystemExit('No usable live quote; recovered evidence is not success')
          PYCODE
