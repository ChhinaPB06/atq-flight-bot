name: Personal YYC–ATQ 54-pair Flight Watch
on:
  push:
    branches: [main]
    paths: [.github/workflows/flight-watch.yml]
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: 'What to run'
        required: true
        default: scan
        type: choice
        options:
          - scan
          - health
          - test-telegram
      fli_channel:
        description: 'Pinned upstream Fli (repair experiment) or stable PyPI 0.9.0'
        required: true
        default: stable
        type: choice
        options:
          - upstream
          - stable
permissions:
  contents: write
concurrency:
  group: personal-flight-watch
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FLI_TIMEOUT: "30"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install selected Fli revision
        env:
          FLI_CHANNEL: ${{ inputs.fli_channel || 'stable' }}
        run: |
          if [ "$FLI_CHANNEL" = 'stable' ]; then
            pip install -r requirements.txt
          else
            pip install 'git+https://github.com/punitarani/fli.git@881aee5ff4321e81ea2157cb44be94ce6a21dc1b'
            pip install -r requirements-timezones.txt
          fi
          python -c 'import fli; print("Installed Fli from:", fli.__file__)'
      - name: Offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Select isolated history path
        run: echo "FLIGHT_DB=$RUNNER_TEMP/flight-state/fares.sqlite3" >> "$GITHUB_ENV"
      - name: Restore durable history
        run: python scripts/persist_state.py restore
      - name: Flight watch task
        env:
          TASK: ${{ inputs.task || 'scan' }}
          FLIGHT_PROVIDER: serpapi
          API_INITIAL_BATCH: '18'
          FLIGHT_DISABLE_ALERTS: '1'
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          CALENDAR_PER_RUN: '2'
          LIVE_PER_RUN: '2'
          PAUSE_SECONDS: '10'
        run: |
          case "$TASK" in
            scan) python tracker.py scan ;;
            health) python tracker.py health ;;
            test-telegram) python tracker.py test-telegram ;;
            *) echo 'Invalid task'; exit 2 ;;
          esac
      - name: Persist history independently of code branches
        if: always()
        run: |
          if [ -f "$FLIGHT_DB" ]; then
            python scripts/persist_state.py save
          fi
      - name: Retain database for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flight-history-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FLIGHT_DB }}
          if-no-files-found: warn
          retention-days: 14
      - name: Auditable scan summary
        if: always()
        run: |
          if [ -f "$FLIGHT_DB" ]; then
            python tracker.py status >> "$GITHUB_STEP_SUMMARY"
          fi
